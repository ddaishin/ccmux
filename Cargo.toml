[package]
name = "ccmux"
version = "0.6.2"
edition = "2021"
description = "Claude Code Multiplexer — manage multiple Claude Code instances in TUI panes"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.8"
vt100 = "0.16"
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-width = "0.2.1"
arboard = "3.6"
syntect = "5.3"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde_json = "1"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
ratatui-image = { version = "10", default-features = false, features = ["crossterm"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "s"

# upstream vt100 (doy/vt100-rust) has been unmaintained for 1+ years with a
# known panic (Issue #28, PR #30 unmerged) that this project hits. Vendored
# copy + local patch — see vendor/vt100/PATCHES.md for the full writeup and
# reapply instructions.
[workspace]
members = ["vendor/vt100"]

[patch.crates-io]
vt100 = { path = "vendor/vt100" }
